<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="824" height="250" viewBox="0 0 824 250" role="img" aria-label="streak --watch">
<title>streak --watch</title>
<style>
text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
.bar { fill: #8b949e; font-size: 12px; }
.in { opacity: 0; animation: fade .6s ease-out forwards; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in { opacity: 1; } }

.ring { stroke-dasharray: 226.2; stroke-dashoffset: 226.2; animation: draw 1.4s ease-out .2s forwards; }
.trace { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 2.4s ease-out .4s forwards; }
.flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 1.6s ease-in-out infinite; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes flick { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08, .94); } }
</style>
<defs>
