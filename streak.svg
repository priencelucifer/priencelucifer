    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff66" stop-opacity=".35"/>
    <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
  </linearGradient>
</defs>
